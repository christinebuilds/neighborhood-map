<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SF Flood Map (beta)</title>
<meta name="description" content="A neighbor-made map of San Francisco storm drains, flood reports, past flooding and the city&#39;s flood zone. A beta, not an official service.">
<meta name="theme-color" content="#2f7d5b">
<link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
<link rel="icon" href="../assets/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="My Neighborhood Map">
<meta property="og:title" content="SF Flood Map (beta)">
<meta property="og:description" content="A neighbor-made map of San Francisco storm drains, flood reports, past flooding and the city&#39;s flood zone. A beta, not an official service.">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="My Neighborhood Map: a green leaf and a raindrop over simple map lines. Trees, birds, walks and flood help for your block, San Francisco, beta.">
<meta name="twitter:card" content="summary_large_image">
<!-- SITE ADDRESS: the only place this page names its full web address. Link previews need it written out in full,
     and chat apps read these tags from this page, not from the map it opens.
     If the site moves, change the URLs in this block.
     When the flood map gets its own preview picture, change only the og:image line. -->
<link rel="canonical" href="https://sfcommunitymap.org/flood">
<meta property="og:url" content="https://sfcommunitymap.org/flood">
<meta property="og:image" content="https://sfcommunitymap.org/assets/preview.png">
<!-- end SITE ADDRESS -->
<!-- This short address only opens the map on the right tab. It keeps ?city= if the link has one. -->
<script>location.replace("../" + location.search + "#flood");</script>
<meta http-equiv="refresh" content="1; url=../#flood">
<style>
html, body { margin: 0; background: #f4f6f7; color: #16252d; font: 17px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 40px 20px; }
a { color: #1d6a9f; }
.small { font-size: 14px; color: #53686f; }
</style>
</head>
<body>
<main>
  <p><a href="../#flood">Open the flood map</a></p>
  <p class="small">Not an official service. Emergency: <a href="tel:911">9-1-1</a>. Report flooding to the city at 3-1-1.</p>
  <p class="small">Free and open source. Built by a neighbor for the community.</p>
</main>
</body>
</html>
